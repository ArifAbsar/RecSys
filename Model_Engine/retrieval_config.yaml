ITEM_ID_FIELD: item_id
RATING_FIELD: rating
TIME_FIELD: timestamp
USER_ID_FIELD: user_id
checkpoint_dir: F:\RecSys\Model_Engine\checkpoints
data_path: F:\RecSys\Model_Engine
dataset: rec
embedding_size: 64
epochs: 10
eval_args:
  group_by: user
  mode: full
  order: RO
  split:
    RS:
    - 0.8
    - 0.1
    - 0.1
eval_step: 1
learner: adam
learning_rate: 0.001
load_col:
  inter:
  - user_id
  - item_id
  - rating
  - timestamp
metrics:
- Recall
- NDCG
- Precision
model: BPR
stopping_step: 2
topk:
- 10
- 20
- 100
train_batch_size: 2048
train_neg_sample_args:
  uniform: 1
use_gpu: true
valid_metric: Recall@20
